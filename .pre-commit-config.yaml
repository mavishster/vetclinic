# Быстрые проверки перед каждым коммитом. Полные проверки — `make check` и CI.
# Установка один раз: `pip install pre-commit && pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
