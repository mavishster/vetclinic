# Единый адрес системы в клинике: https://адрес-сервера
#
# Без https пароли, данные клиентов и ключ сессии идут по сети открытым текстом:
# их читает любой, кто подключился к сети клиники. Заодно https включает микрофон
# (голосовой ввод в медкарте), камеру (фото питомца) и уведомления — без него
# браузер их не разрешает.

# Обычный адрес перенаправляем на защищённый: кто привык набирать без https,
# попадёт куда надо сам.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Сканы, снимки и документы — до 30 МБ (лимит самой системы — 25 МБ на файл).
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Защитные заголовки: страницы системы нельзя встроить в чужой сайт, браузер не
    # «угадывает» тип файлов, адрес страницы не уходит на сторонние сайты.
    # (nginx не наследует add_header в location со своими add_header — там они повторены.)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Камера — только самой системе (фото владельца); микрофон и геолокация — никому.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    server_tokens off;

    # API и админка — в backend.
    location ~ ^/(api|admin)/ {
        # Адрес backend ищется при каждом запросе, а не один раз при запуске nginx:
        # после обновления контейнер получает новый адрес, и иначе запросы уходили бы
        # в никуда, пока nginx не перезапустят («не удалось войти» после prod-update).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        # Настоящий адрес клиента — для защиты от подбора пароля (блокировка по адресу).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s; # длинные отчёты и PDF
    }

    # Оформление админки Django (collectstatic → общий том).
    location /static/ {
        alias /static/;
        expires 7d;
    }

    # Собранный интерфейс: файлы с хешем в имени кэшируются надолго…
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # …а index.html — никогда: после обновления браузер сразу берёт новую версию.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
}
